{% extends "base.html" %}
{% block title %}Page Not Found - CMS{% endblock %}
{% block content %}
<style>
    .error-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
        text-align: center;
    }
    .error-box {
        max-width: 500px;
        padding: 40px 30px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    .error-box .emoji {
        font-size: 72px;
        line-height: 1;
        margin-bottom: 10px;
    }
    .error-box h1 {
        font-size: 48px;
        font-weight: 800;
        color: #2b5d8d;
        margin: 0 0 5px;
    }
    .error-box h2 {
        font-size: 20px;
        color: #333;
        margin-bottom: 15px;
    }
    .error-box p {
        color: #666;
        font-size: 14px;
        margin-bottom: 25px;
    }
    .btn-home {
        background: #2b5d8d;
        color: white;
        border: none;
        padding: 10px 30px;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        transition: background 0.2s;
    }
    .btn-home:hover {
        background: #1f456c;
        color: white;
    }
</style>
<div class="container">
    <div class="error-container">
        <div class="error-box">
            <div class="emoji">🔍</div>
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <a href="{{ url_for('dashboard') }}" class="btn-home">🏠 Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
